apiVersion: apps/v1
kind: Deployment
metadata:
  name: raitbyne-inventory
  namespace: raitbyne
  labels:
    app.kubernetes.io/name: raitbyne-inventory
    app.kubernetes.io/part-of: raitbyne-inventory
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: raitbyne-inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raitbyne-inventory
        app.kubernetes.io/part-of: raitbyne-inventory
    spec:
      serviceAccountName: raitbyne-inventory
      containers:
        - name: inventory-api
          image: europe-west1-docker.pkg.dev/strong-surge-513519-q5/raitbyne-images/raitbyne-inventory:phase5.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: raitbyne-inventory-config
          env:
            - name: DB_PASSWORD_FILE
              value: /var/secrets/db-password
          volumeMounts:
            - name: db-password
              mountPath: /var/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: db-password
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: raitbyne-db-password-gke

---
apiVersion: v1
kind: Service
metadata:
  name: raitbyne-inventory
  namespace: raitbyne
  labels:
    app.kubernetes.io/name: raitbyne-inventory
    app.kubernetes.io/part-of: raitbyne-inventory
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: raitbyne-inventory
  ports:
    - name: http
      port: 80
      targetPort: http
