apiVersion: v1
kind: Service
metadata:
  name: raitbyne-postgres
  namespace: raitbyne
  labels:
    app.kubernetes.io/name: raitbyne-postgres
    app.kubernetes.io/part-of: raitbyne-inventory
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: raitbyne-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raitbyne-postgres
  namespace: raitbyne
  labels:
    app.kubernetes.io/name: raitbyne-postgres
    app.kubernetes.io/part-of: raitbyne-inventory
spec:
  serviceName: raitbyne-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: raitbyne-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raitbyne-postgres
        app.kubernetes.io/part-of: raitbyne-inventory
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: raitbyne-postgres-credentials
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: raitbyne-postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: raitbyne-postgres-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
            - name: database-schema
              mountPath: /docker-entrypoint-initdb.d/001-schema.sql
              subPath: 001-schema.sql
      volumes:
        - name: database-schema
          configMap:
            name: raitbyne-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: database-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
