---
- name: Configure the Linux foundation
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_user: appoperator
    app_directory: /opt/raitbyne-inventory

  tasks:
    - name: Update the APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - nginx
          - unattended-upgrades
        state: present

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Ensure the application user exists
      ansible.builtin.user:
        name: "{{ app_user }}"
        state: present
        create_home: true

    - name: Ensure the application directory exists
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"

    - name: Ensure automatic updates are scheduled
      ansible.builtin.systemd:
        name: apt-daily-upgrade.timer
        state: started
        enabled: true

    - name: Deploy the health-check script
      ansible.builtin.copy:
        src: ../files/health-check
        dest: /usr/local/bin/health-check
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the patch-report script
      ansible.builtin.copy:
        src: ../files/patch-report
        dest: /usr/local/bin/patch-report
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the health-check systemd service
      ansible.builtin.template:
        src: ../templates/health-check.service.j2
        dest: /etc/systemd/system/health-check.service
        owner: root
        group: root
        mode: "0644"

    - name: Deploy the health-check systemd timer
      ansible.builtin.template:
        src: ../templates/health-check.timer.j2
        dest: /etc/systemd/system/health-check.timer
        owner: root
        group: root
        mode: "0644"

    - name: Reload systemd after deploying service files
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Ensure the health-check timer is enabled and running
      ansible.builtin.systemd:
        name: health-check.timer
        state: started
        enabled: true
