apiVersion: v1
kind: Service
metadata:
  name: raitbyne-postgres
  namespace: raitbyne
  labels:
    app.kubernetes.io/name: raitbyne-postgres
    app.kubernetes.io/part-of: raitbyne-inventory
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: raitbyne-postgres
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raitbyne-postgres
  namespace: raitbyne
  labels:
    app.kubernetes.io/name: raitbyne-postgres
    app.kubernetes.io/part-of: raitbyne-inventory
spec:
  serviceName: raitbyne-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: raitbyne-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raitbyne-postgres
        app.kubernetes.io/part-of: raitbyne-inventory
    spec:
      serviceAccountName: raitbyne-postgres
      containers:
        - name: postgresql
          image: postgres:16-alpine
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: raitbyne-inventory-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: raitbyne-inventory-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD_FILE
              value: /var/secrets/db-password
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
            - name: database-schema
              mountPath: /docker-entrypoint-initdb.d/001-schema.sql
              subPath: 001-schema.sql
            - name: db-password
              mountPath: /var/secrets
              readOnly: true
      volumes:
        - name: database-schema
          configMap:
            name: raitbyne-postgres-init
        - name: db-password
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: raitbyne-db-password-gke
  volumeClaimTemplates:
    - metadata:
        name: database-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
